<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DND Синхронная карта</title>
    
    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #eee;
            text-align: center;
            margin: 0;
            padding: 0;
            padding-bottom: 20px;
            min-height: 100vh;
            touch-action: pan-y;
        }

        /* ===== ВВОД НИКА ===== */
        .nickname-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .nickname-container.hidden {
            display: none;
        }
        .nickname-box {
            background: #2a2a2a;
            padding: 30px 40px;
            border-radius: 20px;
            border: 2px solid #f1c40f;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .nickname-box label {
            display: block;
            font-size: 22px;
            margin-bottom: 15px;
            color: #eee;
        }
        .nickname-box input {
            width: 100%;
            padding: 12px;
            font-size: 20px;
            border-radius: 10px;
            border: 2px solid #555;
            background: #1e1e1e;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        .nickname-box input:focus {
            border-color: #f1c40f;
        }
        .nickname-box button {
            background: #2980b9;
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px;
            min-height: 48px;
        }
        .nickname-box button:hover {
            background: #3498db;
        }
        .nickname-box button:active {
            transform: scale(0.95);
        }
        .nickname-box .skip-btn {
            background: #555;
        }
        .nickname-box .skip-btn:hover {
            background: #777;
        }

        /* ===== ЗАГОЛОВОК ===== */
        h1 {
            font-size: 20px;
            margin: 6px 0;
            flex-shrink: 0;
        }

        /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 4px 8px;
            padding: 4px 10px;
            background: #222;
            border-bottom: 1px solid #333;
        }
        .top-bar .player-id {
            color: #f1c40f;
            font-size: 14px;
            font-weight: bold;
        }
        .top-bar .gm-indicator {
            color: #8e44ad;
            font-size: 13px;
        }
        .top-bar button {
            background: #2c3e50;
            border: 2px solid #444;
            color: white;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 32px;
            transition: 0.2s;
        }
        .top-bar button:hover {
            border-color: #f1c40f;
        }
        .top-bar button:active {
            transform: scale(0.95);
        }
        .top-bar button.active {
            border-color: #f1c40f;
            background: #34495e;
        }
        .top-bar button.gm-btn.active {
            background: #f1c40f;
            color: #1e1e1e;
            border-color: #f1c40f;
        }
        .top-bar button.danger {
            background: #c0392b;
            border-color: #c0392b;
        }
        .top-bar button[data-map] {
            font-size: 12px;
            padding: 2px 10px;
            min-height: 28px;
        }
        .top-bar button[data-map].active {
            border-color: #f1c40f;
            background: #34495e;
        }
        .top-bar button[data-map].disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ===== КАРТА ===== */
        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            aspect-ratio: 16 / 10;
            background: #1a1a1a;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
            border: 2px solid #333;
            border-radius: 4px;
        }
        .map-wrapper:active {
            cursor: grabbing;
        }

        .map-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            touch-action: none;
            will-change: transform;
        }

        .map-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #1a1a1a;
            pointer-events: none;
        }

        /* ===== СЕТКА ===== */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            pointer-events: none;
            z-index: 5;
        }
        .grid-overlay .cell {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
            aspect-ratio: 1 / 1;
        }
        .grid-overlay.hidden {
            display: none;
        }

        /* ===== ФИГУРКИ ===== */
        .tokens-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            z-index: 10;
        }
        .token {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            border: 2px solid white;
            cursor: grab;
            touch-action: none;
            text-shadow: 0 0 5px black;
            transform: translate(-50%, -50%);
            left: 0;
            top: 0;
            z-index: 10;
            transition: filter 0.2s;
            will-change: transform, width, height, font-size;
        }
        .token:active {
            cursor: grabbing;
            filter: brightness(1.3);
            z-index: 20;
        }
        .token.snap {
            transition: left 0.1s ease, top 0.1s ease;
        }

        /* ===== КОНТРОЛЛЫ КАРТЫ ===== */
        .map-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 4px 8px;
            padding: 6px 10px;
            background: #222;
            border-bottom: 1px solid #333;
        }
        .map-controls button {
            background: #2c3e50;
            border: 2px solid #444;
            color: white;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 14px;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 32px;
            transition: 0.2s;
        }
        .map-controls button:hover {
            border-color: #f1c40f;
        }
        .map-controls button:active {
            transform: scale(0.95);
        }
        .map-controls .zoom-label {
            color: #aaa;
            font-size: 13px;
            min-width: 40px;
        }
        .map-controls input[type="range"] {
            width: 100px;
            accent-color: #f1c40f;
            cursor: pointer;
            touch-action: manipulation;
        }
        .map-controls .grid-label {
            color: #888;
            font-size: 12px;
            min-width: 40px;
        }
        .map-controls .grid-size-label {
            color: #aaa;
            font-size: 13px;
            min-width: 50px;
        }

        /* ===== КНОПКИ КУБИКОВ ===== */
        .dice-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 4px 8px;
            padding: 6px 10px;
            background: #222;
            border-bottom: 1px solid #333;
        }
        .dice-controls button {
            background: #34495e;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 16px;
            min-height: 38px;
            min-width: 38px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 2px 0 #1f2c38;
            transition: 0.1s;
        }
        .dice-controls button:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        .dice-controls button.d20 {
            background: #2980b9;
            box-shadow: 0 2px 0 #1a5276;
        }
        .dice-controls .dice-area {
            font-size: 32px;
            background: #2a2a2a;
            padding: 4px 16px;
            border-radius: 16px;
            min-width: 60px;
            display: inline-block;
        }
        .dice-controls .log {
            font-size: 14px;
            color: #aaa;
            min-height: 24px;
        }

        /* ===== ВЫБОР ИКОНОК ===== */
        .icon-picker {
            display: none;
            background: #2a2a2a;
            padding: 8px;
            border-radius: 12px;
            margin: 4px auto;
            max-width: 350px;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            border: 2px solid #555;
        }
        .icon-picker.active {
            display: flex;
        }
        .icon-picker button {
            font-size: 28px;
            background: #444;
            border: 2px solid transparent;
            border-radius: 8px;
            padding: 4px 10px;
            min-height: 44px;
            cursor: pointer;
        }

        /* ===== ЛОГ БРОСКОВ ===== */
        .roll-log-container {
            max-width: 800px;
            margin: 10px auto 0 auto;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            padding: 6px 12px;
            border: 1px solid #333;
            max-height: 150px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            width: 98%;
        }
        .roll-log-container::-webkit-scrollbar {
            width: 4px;
        }
        .roll-log-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }
        .roll-log-title {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
            text-align: left;
        }
        .roll-log-entry {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #ddd;
            text-align: left;
        }
        .roll-log-entry:last-child {
            border-bottom: none;
        }
        .roll-log-entry .roll-player {
            color: #f1c40f;
            font-weight: bold;
            font-size: 12px;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .roll-log-entry .roll-dice {
            color: #888;
            font-size: 11px;
        }
        .roll-log-entry .roll-value {
            color: #fff;
            font-weight: bold;
            background: #2a2a2a;
            padding: 0 8px;
            border-radius: 4px;
            min-width: 24px;
            text-align: center;
            font-size: 13px;
        }
        .roll-log-entry .roll-crit {
            color: #f1c40f;
            animation: pulseGold 0.5s ease;
        }
        .roll-log-entry .roll-fail {
            color: #e74c3c;
            animation: pulseRed 0.5s ease;
        }
        .roll-log-empty {
            color: #555;
            font-style: italic;
            font-size: 12px;
            padding: 4px 0;
            text-align: center;
        }

        @keyframes pulseGold {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ffd700; }
            100% { transform: scale(1); }
        }
        @keyframes pulseRed {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ff0000; }
            100% { transform: scale(1); }
        }

        /* ===== ТОСТ ===== */
        .roll-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid #f1c40f;
            z-index: 999;
            animation: slideUp 0.3s ease, fadeOut 3s ease 2.5s forwards;
            pointer-events: none;
            max-width: 90%;
            white-space: nowrap;
        }
        @keyframes slideUp {
            0% { transform: translateX(-50%) translateY(20px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        /* ===== АДАПТАЦИЯ ===== */
        @media (max-width: 600px) {
            h1 { font-size: 16px; margin: 4px 0; }
            .top-bar button { font-size: 11px; padding: 2px 8px; min-height: 26px; }
            .top-bar button[data-map] { font-size: 10px; padding: 2px 6px; min-height: 24px; }
            .map-controls button { font-size: 12px; padding: 2px 8px; min-height: 28px; }
            .map-controls input[type="range"] { width: 70px; }
            .map-controls .grid-label { font-size: 10px; min-width: 30px; }
            .dice-controls button { font-size: 14px; padding: 4px 10px; min-height: 32px; min-width: 32px; }
            .dice-controls .dice-area { font-size: 26px; padding: 2px 12px; min-width: 44px; }
            .roll-log-container { max-height: 100px; }
            .roll-log-entry { font-size: 11px; }
            .roll-log-entry .roll-player { max-width: 50px; font-size: 10px; }
        }

        @media (max-width: 400px) {
            .top-bar button[data-map] { font-size: 9px; padding: 1px 4px; min-height: 20px; }
            .map-controls input[type="range"] { width: 50px; }
            .map-controls .grid-label { font-size: 9px; min-width: 25px; }
        }
    </style>
</head>
<body>

    <h1>⚔️ Поле боя</h1>

    <!-- ===== ВВОД НИКА ===== -->
    <div class="nickname-container" id="nicknameContainer">
        <div class="nickname-box">
            <label for="nicknameInput">👤 Введи свой ник:</label>
            <input type="text" id="nicknameInput" placeholder="Например: Гэндальф" maxlength="20">
            <button onclick="saveNickname()">✅ Сохранить</button>
            <button onclick="skipNickname()" class="skip-btn">Пропустить</button>
        </div>
    </div>

    <!-- ===== ВЕРХНЯЯ ПАНЕЛЬ ===== -->
    <div class="top-bar">
        <span class="player-id" id="playerId">Загрузка...</span>
        <span class="gm-indicator" id="gmIndicator"></span>
        <button onclick="toggleGM()" class="gm-btn" id="gmToggleBtn">👑 GM</button>
        <button onclick="showChangeName()">✏️ Сменить ник</button>
        <button onclick="showIconPicker()">➕ Добавить</button>
        <button class="danger" onclick="clearTokens()">🗑️</button>
        <button onclick="toggleGrid()" class="active" id="gridToggleBtn">📐</button>
        <button onclick="toggleSnap()" class="active" id="snapToggleBtn">🎯</button>
    </div>

    <!-- ===== ВЫБОР КАРТЫ ===== -->
    <div class="top-bar" style="border-bottom: none; background: #1a1a1a; gap: 4px; padding: 4px 10px;">
        <button onclick="changeMap('forest')" data-map="forest" class="active">🌲 Лес</button>
        <button onclick="changeMap('dungeon')" data-map="dungeon">🏚️ Подземелье</button>
        <button onclick="changeMap('castle')" data-map="castle">🏰 Замок</button>
        <button onclick="changeMap('tavern')" data-map="tavern">🍺 Таверна</button>
        <button onclick="changeMap('cave')" data-map="cave">🕳️ Пещера</button>
    </div>

    <!-- ===== КАРТА ===== -->
    <div class="map-wrapper" id="mapWrapper">
        <div class="map-inner" id="mapInner">
            <img class="map-image" id="mapImage" src="images/forest.jpg" alt="Карта">
            <div class="grid-overlay" id="gridOverlay"></div>
            <div class="tokens-layer" id="tokensLayer"></div>
        </div>
    </div>

    <!-- ===== УПРАВЛЕНИЕ КАРТОЙ ===== -->
    <div class="map-controls">
        <button onclick="zoomOut()">➖</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button onclick="zoomIn()">➕</button>
        <button onclick="resetZoom()" style="font-size:14px;">⟲</button>
        <span style="color:#444;">|</span>
        <span class="grid-label">📐</span>
        <input type="range" id="gridSizeSlider" min="4" max="40" value="10" step="1">
        <span class="grid-size-label" id="gridSizeLabel">10x6</span>
    </div>

    <!-- ===== КУБИКИ ===== -->
    <div class="dice-controls">
        <div class="dice-area" id="diceDisplay">🎲</div>
        <button class="d20" onclick="rollDice(20)">d20</button>
        <button onclick="rollDice(6)">d6</button>
        <button onclick="rollDice(8)">d8</button>
        <button onclick="rollDice(10)">d10</button>
        <button onclick="rollDice(12)">d12</button>
        <button onclick="rollDice(100)">d100</button>
        <span class="log" id="log">Привет!</span>
    </div>

    <!-- ===== ВЫБОР ИКОНОК ===== -->
    <div class="icon-picker" id="iconPicker">
        <button onclick="addToken('🧙‍♂️')">🧙‍♂️</button>
        <button onclick="addToken('🏹')">🏹</button>
        <button onclick="addToken('🗡️')">🗡️</button>
        <button onclick="addToken('🛡️')">🛡️</button>
        <button onclick="addToken('🐉')">🐉</button>
        <button onclick="addToken('👹')">👹</button>
        <button onclick="addToken('🧝')">🧝</button>
        <button onclick="addToken('💀')">💀</button>
        <button onclick="addToken('🐺')">🐺</button>
        <button onclick="addToken('🧌')">🧌</button>
        <button onclick="hideIconPicker()" style="background:#c0392b;">✖</button>
    </div>

    <!-- ===== ЛОГ БРОСКОВ ===== -->
    <div class="roll-log-container" id="rollLogContainer">
        <div class="roll-log-title">📜 История бросков</div>
        <div id="rollLogEntries">
            <div class="roll-log-empty">Броски будут здесь...</div>
        </div>
    </div>

    <script>
        // ============================================
        // ТВОЙ КОНФИГ FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCfb0M7LS3nzPcabFuvekS815GvH1fUK_Q",
            authDomain: "dnd-rubezhata.firebaseapp.com",
            databaseURL: "https://dnd-rubezhata-default-rtdb.firebaseio.com",
            projectId: "dnd-rubezhata",
            storageBucket: "dnd-rubezhata.firebasestorage.app",
            messagingSenderId: "67134397384",
            appId: "1:67134397384:web:2d29685b1070abaaba3efd"
        };
        // ============================================

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================
        // РАБОТА С НИКОМ И GM
        // ============================================
        const GM_PASSWORD = 'gm123';
        let isGM = false;
        let playerName = localStorage.getItem('dnd_player_name') || '';
        const randomId = 'Player_' + Math.random().toString(36).substring(2, 6);
        let displayName = playerName || randomId;

        if (!playerName) {
            document.getElementById('nicknameContainer').classList.remove('hidden');
            document.getElementById('log').textContent = '👋 Введи свой ник!';
        } else {
            document.getElementById('nicknameContainer').classList.add('hidden');
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Привет, ' + displayName + '!';
        }

        function saveNickname() {
            const input = document.getElementById('nicknameInput');
            const name = input.value.trim();
            if (name.length === 0) { alert('❌ Введи хотя бы один символ!'); return; }
            if (name.length > 20) { alert('❌ Ник не может быть длиннее 20 символов!'); return; }
            playerName = name;
            displayName = name;
            localStorage.setItem('dnd_player_name', name);
            document.getElementById('nicknameContainer').classList.add('hidden');
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Привет, ' + displayName + '!';
        }

        function skipNickname() {
            displayName = randomId;
            document.getElementById('nicknameContainer').classList.add('hidden');
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Играем без ника';
        }

        function showChangeName() {
            const newName = prompt('✏️ Введи новый ник:', displayName);
            if (newName === null) return;
            const trimmed = newName.trim();
            if (trimmed.length === 0) { alert('❌ Ник не может быть пустым!'); return; }
            if (trimmed.length > 20) { alert('❌ Ник не может быть длиннее 20 символов!'); return; }
            playerName = trimmed;
            displayName = trimmed;
            localStorage.setItem('dnd_player_name', trimmed);
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Привет, ' + displayName + '!';
        }

        // ========== GM ==========
        function toggleGM() {
            if (isGM) {
                isGM = false;
                document.getElementById('gmIndicator').textContent = '';
                document.getElementById('gmToggleBtn').classList.remove('active');
                document.getElementById('log').textContent = '👑 Режим GM выключен';
                updateMapButtons();
                return;
            }
            const password = prompt('👑 Введите пароль GM:');
            if (password === null) return;
            if (password === GM_PASSWORD) {
                isGM = true;
                document.getElementById('gmIndicator').textContent = '👑 GM';
                document.getElementById('gmIndicator').style.color = '#f1c40f';
                document.getElementById('gmToggleBtn').classList.add('active');
                document.getElementById('log').textContent = '👑 Режим GM включен!';
                updateMapButtons();
            } else {
                alert('❌ Неверный пароль!');
            }
        }

        // ============================================
        // УПРАВЛЕНИЕ КАРТОЙ (Zoom + Pan)
        // ============================================
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDraggingMap = false;
        let startX, startY, startPanX, startPanY;
        let lastTouchDist = 0;

        const mapWrapper = document.getElementById('mapWrapper');
        const mapInner = document.getElementById('mapInner');
        const mapImage = document.getElementById('mapImage');
        const zoomLabel = document.getElementById('zoomLabel');

        function updateTransform() {
            mapInner.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
            zoomLabel.textContent = Math.round(scale * 100) + '%';
            updateTokenSizes();
        }

        function zoomIn() {
            scale = Math.min(3, scale + 0.15);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(0.3, scale - 0.15);
            updateTransform();
        }

        function resetZoom() {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        // ===== ПЕРЕТАСКИВАНИЕ КАРТЫ (мышь) =====
        mapWrapper.addEventListener('mousedown', function(e) {
            if (e.target.closest('.token')) return;
            isDraggingMap = true;
            startX = e.clientX;
            startY = e.clientY;
            startPanX = panX;
            startPanY = panY;
            mapWrapper.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', function(e) {
            if (!isDraggingMap) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            panX = startPanX + dx;
            panY = startPanY + dy;
            updateTransform();
        });

        window.addEventListener('mouseup', function() {
            isDraggingMap = false;
            mapWrapper.style.cursor = 'grab';
        });

        // ===== ПЕРЕТАСКИВАНИЕ КАРТЫ (touch) =====
        mapWrapper.addEventListener('touchstart', function(e) {
            if (e.target.closest('.token')) return;
            if (e.touches.length === 1) {
                isDraggingMap = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                startPanX = panX;
                startPanY = panY;
            }
        }, { passive: true });

        mapWrapper.addEventListener('touchmove', function(e) {
            if (e.touches.length === 1 && isDraggingMap) {
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;
                panX = startPanX + dx;
                panY = startPanY + dy;
                updateTransform();
            }
            if (e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                if (lastTouchDist > 0) {
                    const delta = dist - lastTouchDist;
                    scale = Math.min(3, Math.max(0.3, scale + delta * 0.005));
                    updateTransform();
                }
                lastTouchDist = dist;
                e.preventDefault();
            }
        }, { passive: false });

        mapWrapper.addEventListener('touchend', function() {
            isDraggingMap = false;
            lastTouchDist = 0;
        }, { passive: true });

        // ============================================
        // СЕТКА И РАЗМЕР ФИГУРОК
        // ============================================
        let snapEnabled = true;
        let gridVisible = true;
        let gridCols = 10;
        let gridRows = 6;

        const gridOverlay = document.getElementById('gridOverlay');
        const gridSizeSlider = document.getElementById('gridSizeSlider');
        const gridSizeLabel = document.getElementById('gridSizeLabel');

        function buildGrid() {
            gridOverlay.innerHTML = '';
            gridOverlay.style.gridTemplateColumns = 'repeat(' + gridCols + ', 1fr)';
            gridOverlay.style.gridTemplateRows = 'repeat(' + gridRows + ', 1fr)';
            for (let i = 0; i < gridCols * gridRows; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                gridOverlay.appendChild(cell);
            }
        }
        buildGrid();

        // Обновляем размер фигурок в зависимости от размера клетки
        function updateTokenSizes() {
            // Размер клетки в процентах
            const cellW = 100 / gridCols;
            const cellH = 100 / gridRows;
            // Фигурка занимает ~80% от клетки, но не меньше 20px и не больше 60px
            const sizePercent = Math.min(cellW, cellH) * 0.8;
            // Переводим в пиксели относительно контейнера
            const containerRect = mapWrapper.getBoundingClientRect();
            const containerSize = Math.min(containerRect.width, containerRect.height);
            const pixelSize = Math.max(20, Math.min(60, containerSize * sizePercent / 100));
            
            document.querySelectorAll('.token').forEach(token => {
                const fontSize = Math.max(14, Math.min(40, pixelSize * 0.85));
                token.style.fontSize = fontSize + 'px';
                token.style.width = sizePercent + '%';
                token.style.height = sizePercent + '%';
                token.style.minWidth = '16px';
                token.style.minHeight = '16px';
                token.style.maxWidth = '70px';
                token.style.maxHeight = '70px';
            });
        }

        gridSizeSlider.addEventListener('change', function() {
            if (!isGM) {
                document.getElementById('log').textContent = '⛔ Только GM может менять сетку!';
                gridSizeSlider.value = gridCols;
                return;
            }
            const newCols = parseInt(this.value);
            const newRows = Math.round(newCols * 0.6);
            if (newRows < 3) return;
            gridCols = newCols;
            gridRows = newRows;
            gridSizeLabel.textContent = gridCols + 'x' + gridRows;
            buildGrid();
            recalcTokenPositions();
            updateTokenSizes();
            document.getElementById('log').textContent = '📐 Сетка: ' + gridCols + 'x' + gridRows;
        });

        // Обновляем label при движении ползунка
        gridSizeSlider.addEventListener('input', function() {
            const newCols = parseInt(this.value);
            const newRows = Math.round(newCols * 0.6);
            if (newRows < 3) return;
            gridSizeLabel.textContent = newCols + 'x' + newRows;
        });

        function toggleGrid() {
            gridVisible = !gridVisible;
            gridOverlay.classList.toggle('hidden');
            document.getElementById('gridToggleBtn').classList.toggle('active');
        }

        function toggleSnap() {
            snapEnabled = !snapEnabled;
            document.getElementById('snapToggleBtn').classList.toggle('active');
            document.querySelectorAll('.token').forEach(el => {
                el.classList.toggle('snap');
            });
            document.getElementById('log').textContent = '🎯 Прилипание: ' + (snapEnabled ? 'Вкл' : 'Выкл');
        }

        // ============================================
        // ФИГУРКИ
        // ============================================
        const tokensLayer = document.getElementById('tokensLayer');
        let tokens = {};
        let nextId = 1;
        let draggedToken = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let isLocalUpdate = false;

        function getSnappedPosition(x, y) {
            if (!snapEnabled) return { x, y };
            const cellW = 100 / gridCols;
            const cellH = 100 / gridRows;
            const col = Math.round(x / cellW);
            const row = Math.round(y / cellH);
            return {
                x: Math.max(0, Math.min(100, col * cellW + cellW / 2)),
                y: Math.max(0, Math.min(100, row * cellH + cellH / 2))
            };
        }

        function recalcTokenPositions() {
            Object.values(tokens).forEach(token => {
                const pos = getSnappedPosition(token.x, token.y);
                token.x = pos.x;
                token.y = pos.y;
            });
            saveTokens();
            renderTokens();
        }

        // ===== ЗАГРУЗКА ТОКЕНОВ =====
        const tokensRef = db.ref('tokens');

        tokensRef.once('value', function(snapshot) {
            const data = snapshot.val();
            if (data) {
                tokens = data;
                Object.keys(tokens).forEach(id => {
                    const numId = parseInt(id);
                    if (numId >= nextId) nextId = numId + 1;
                });
                renderTokens();
                // Обновляем размеры после рендера
                setTimeout(updateTokenSizes, 50);
            }
        });

        tokensRef.on('child_added', function(snapshot) {
            if (isLocalUpdate) return;
            const id = parseInt(snapshot.key);
            const data = snapshot.val();
            tokens[id] = data;
            renderToken(id);
        });

        tokensRef.on('child_changed', function(snapshot) {
            if (isLocalUpdate) return;
            const id = parseInt(snapshot.key);
            const data = snapshot.val();
            tokens[id] = data;
            renderToken(id);
        });

        tokensRef.on('child_removed', function(snapshot) {
            if (isLocalUpdate) return;
            const id = parseInt(snapshot.key);
            delete tokens[id];
            const el = tokensLayer.querySelector(`[data-id="${id}"]`);
            if (el) el.remove();
        });

        function renderToken(id) {
            const token = tokens[id];
            if (!token) return;
            let el = tokensLayer.querySelector(`[data-id="${id}"]`);
            if (!el) {
                el = document.createElement('div');
                el.className = 'token';
                if (snapEnabled) el.classList.add('snap');
                el.dataset.id = id;
                el.addEventListener('dblclick', () => deleteToken(id));
                el.addEventListener('touchstart', (e) => {
                    const timer = setTimeout(() => {
                        if (navigator.vibrate) navigator.vibrate(50);
                        deleteToken(id);
                    }, 800);
                    el._timer = timer;
                });
                el.addEventListener('touchend', () => clearTimeout(el._timer));
                el.addEventListener('touchmove', () => clearTimeout(el._timer));
                el.addEventListener('mousedown', (e) => startDrag(e, id));
                el.addEventListener('touchstart', (e) => startDrag(e, id), { passive: false });
                tokensLayer.appendChild(el);
            }
            el.textContent = token.icon;
            el.style.left = token.x + '%';
            el.style.top = token.y + '%';
            
            // Размер фигурки будет установлен в updateTokenSizes()
            // Но сразу задаём базовый размер, чтобы не было скачков
            const cellW = 100 / gridCols;
            const cellH = 100 / gridRows;
            const sizePercent = Math.min(cellW, cellH) * 0.8;
            el.style.width = sizePercent + '%';
            el.style.height = sizePercent + '%';
            el.style.fontSize = Math.max(14, sizePercent * 0.85) + 'px';
        }

        function renderTokens() {
            tokensLayer.innerHTML = '';
            Object.keys(tokens).forEach(id => renderToken(parseInt(id)));
            setTimeout(updateTokenSizes, 50);
        }

        function saveTokens() {
            isLocalUpdate = true;
            tokensRef.set(tokens).then(() => {
                isLocalUpdate = false;
            });
        }

        function deleteToken(id) {
            if (!isGM) {
                document.getElementById('log').textContent = '⛔ Только GM может удалять!';
                return;
            }
            isLocalUpdate = true;
            tokensRef.child(id).remove().then(() => {
                isLocalUpdate = false;
            });
            document.getElementById('log').textContent = '🗑️ Удалён персонаж';
        }

        function addToken(icon) {
            const offsetX = (Math.random() - 0.5) * 8;
            const offsetY = (Math.random() - 0.5) * 8;
            const pos = getSnappedPosition(50 + offsetX, 50 + offsetY);
            const id = nextId++;
            const tokenData = { icon: icon, x: pos.x, y: pos.y };
            isLocalUpdate = true;
            tokensRef.child(id).set(tokenData).then(() => {
                isLocalUpdate = false;
            });
            hideIconPicker();
            if (navigator.vibrate) navigator.vibrate(20);
            document.getElementById('log').textContent = '➕ Добавлен ' + icon;
        }

        function clearTokens() {
            if (!isGM) {
                document.getElementById('log').textContent = '⛔ Только GM может очищать!';
                return;
            }
            if (Object.keys(tokens).length === 0) return;
            if (confirm('Удалить всех персонажей?')) {
                isLocalUpdate = true;
                tokensRef.set(null).then(() => {
                    isLocalUpdate = false;
                });
                document.getElementById('log').textContent = '🗑️ Все удалены';
            }
        }

        function showIconPicker() {
            document.getElementById('iconPicker').classList.toggle('active');
        }

        function hideIconPicker() {
            document.getElementById('iconPicker').classList.remove('active');
        }

        // ========== ПЕРЕТАСКИВАНИЕ ФИГУРОК ==========
        function startDrag(e, tokenId) {
            e.preventDefault();
            const token = tokens[tokenId];
            if (!token) return;

            const rect = mapWrapper.getBoundingClientRect();
            let clientX, clientY;
            if (e.type === 'touchstart') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const tokenX = (clientX - rect.left) / rect.width * 100;
            const tokenY = (clientY - rect.top) / rect.height * 100;
            dragOffsetX = tokenX - token.x;
            dragOffsetY = tokenY - token.y;
            draggedToken = tokenId;

            window.addEventListener('mousemove', onDrag);
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchmove', onDrag, { passive: false });
            window.addEventListener('touchend', endDrag, { passive: false });
        }

        function onDrag(e) {
            if (draggedToken === null) return;
            e.preventDefault();
            const token = tokens[draggedToken];
            if (!token) return;

            const rect = mapWrapper.getBoundingClientRect();
            let clientX, clientY;
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let newX = (clientX - rect.left) / rect.width * 100 - dragOffsetX;
            let newY = (clientY - rect.top) / rect.height * 100 - dragOffsetY;
            
            if (snapEnabled) {
                const snapped = getSnappedPosition(newX, newY);
                newX = snapped.x;
                newY = snapped.y;
            } else {
                newX = Math.max(0, Math.min(100, newX));
                newY = Math.max(0, Math.min(100, newY));
            }

            token.x = newX;
            token.y = newY;

            const el = tokensLayer.querySelector(`[data-id="${draggedToken}"]`);
            if (el) {
                el.style.left = newX + '%';
                el.style.top = newY + '%';
            }
        }

        function endDrag(e) {
            if (draggedToken !== null && tokens[draggedToken]) {
                const token = tokens[draggedToken];
                isLocalUpdate = true;
                tokensRef.child(draggedToken).set(token).then(() => {
                    isLocalUpdate = false;
                });
                draggedToken = null;
            }
            window.removeEventListener('mousemove', onDrag);
            window.removeEventListener('mouseup', endDrag);
            window.removeEventListener('touchmove', onDrag);
            window.removeEventListener('touchend', endDrag);
        }

        // ============================================
        // СИНХРОНИЗАЦИЯ КАРТЫ
        // ============================================
        let currentMap = 'forest';
        let isLocalMapUpdate = false;

        const mapRef = db.ref('currentMap');
        mapRef.on('value', function(snapshot) {
            if (isLocalMapUpdate) return;
            const mapName = snapshot.val();
            if (mapName && mapName !== currentMap) {
                currentMap = mapName;
                updateMapUI(mapName);
            }
        });

        function changeMap(mapName) {
            if (!isGM) {
                document.getElementById('log').textContent = '⛔ Только GM может менять карту!';
                return;
            }
            isLocalMapUpdate = true;
            currentMap = mapName;
            mapRef.set(mapName).then(() => {
                isLocalMapUpdate = false;
            });
            updateMapUI(mapName);
            document.getElementById('log').textContent = '🗺️ Карта: ' + mapName;
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function updateMapUI(mapName) {
            mapImage.src = 'images/' + mapName + '.jpg';
            document.querySelectorAll('.top-bar button[data-map]').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.map === mapName) btn.classList.add('active');
            });
            resetZoom();
        }

        function updateMapButtons() {
            document.querySelectorAll('.top-bar button[data-map]').forEach(btn => {
                if (isGM) {
                    btn.classList.remove('disabled');
                } else {
                    btn.classList.add('disabled');
                }
            });
        }

        mapRef.once('value', function(snapshot) {
            const mapName = snapshot.val();
            if (mapName) {
                currentMap = mapName;
                updateMapUI(mapName);
            }
            updateMapButtons();
        });

        // ============================================
        // ЛОГ БРОСКОВ
        // ============================================
        const MAX_LOG_ENTRIES = 15;

        function addLogEntry(player, sides, result) {
            const container = document.getElementById('rollLogEntries');
            const empty = container.querySelector('.roll-log-empty');
            if (empty) empty.remove();
            
            const entry = document.createElement('div');
            entry.className = 'roll-log-entry';
            let valueHtml = '<span class="roll-value">' + result + '</span>';
            if (sides === 20 && result === 20) {
                valueHtml = '<span class="roll-value roll-crit">' + result + ' 🔥</span>';
            } else if (sides === 20 && result === 1) {
                valueHtml = '<span class="roll-value roll-fail">' + result + ' 💀</span>';
            }
            entry.innerHTML = 
                '<span class="roll-player">' + player + '</span>' +
                '<span class="roll-dice">d' + sides + '</span>' +
                valueHtml;
            container.prepend(entry);
            while (container.children.length > MAX_LOG_ENTRIES) {
                container.removeChild(container.lastChild);
            }
        }

        function showRollToast(msg) {
            const old = document.querySelectorAll('.roll-toast');
            old.forEach(el => el.remove());
            const div = document.createElement('div');
            div.className = 'roll-toast';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        // ============================================
        // КУБИКИ
        // ============================================
        function rollDice(sides) {
            let result = Math.floor(Math.random() * sides) + 1;
            let crit = false, fail = false;
            let msg = displayName + ' кинул d' + sides + ': ' + result;
            if (sides === 20 && result === 20) { crit = true; msg += ' 🔥 КРИТ!'; }
            if (sides === 20 && result === 1) { fail = true; msg += ' 💀 ПРОВАЛ!'; }

            document.getElementById('diceDisplay').textContent = '⏳';
            addLogEntry(displayName, sides, result);

            const rollRef = db.ref('rolls');
            rollRef.push({
                player: displayName,
                sides: sides,
                result: result,
                crit: crit,
                fail: fail,
                timestamp: Date.now()
            });

            setTimeout(() => {
                document.getElementById('diceDisplay').textContent = '🎲 ' + result;
                document.getElementById('log').textContent = 'Твой бросок: ' + result;
            }, 200);
        }

        const rollRef = db.ref('rolls');
        rollRef.limitToLast(1).on('child_added', function(snapshot) {
            const data = snapshot.val();
            if (data.player === displayName) return;
            addLogEntry(data.player, data.sides, data.result);
            let msg = '🎲 ' + data.player + ' кинул d' + data.sides + ': ' + data.result;
            if (data.crit) msg += ' 🔥';
            if (data.fail) msg += ' 💀';
            showRollToast(msg);
            document.getElementById('diceDisplay').textContent = '⏳';
            setTimeout(() => {
                document.getElementById('diceDisplay').textContent = '🎲 ' + data.result;
            }, 200);
        });

        // ============================================
        // ЗАПУСК
        // ============================================
        gridSizeLabel.textContent = gridCols + 'x' + gridRows;
        updateTransform();

        // При изменении размера окна обновляем размеры фигурок
        window.addEventListener('resize', updateTokenSizes);

        if (!playerName) {
            document.getElementById('log').textContent = '👋 Введи свой ник!';
        }
    </script>
</body>
</html>
