<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DND Карта</title>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>
    <style>
        /* ===== ВСЕ СТИЛИ ТЕ ЖЕ ===== */
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body {
            font-family: Arial, sans-serif; background: #1a1a1a; color: #eee;
            text-align: center; margin: 0; padding: 0; padding-bottom: 20px; min-height: 100vh;
        }
        .nickname-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 9999;
        }
        .nickname-container.hidden { display: none; }
        .nickname-box {
            background: #2a2a2a; padding: 30px 40px; border-radius: 20px;
            border: 2px solid #f1c40f; text-align: center; max-width: 400px; width: 90%;
        }
        .nickname-box label { display: block; font-size: 22px; margin-bottom: 15px; color: #eee; }
        .nickname-box input {
            width: 100%; padding: 12px; font-size: 20px; border-radius: 10px;
            border: 2px solid #555; background: #1e1e1e; color: #fff;
            margin-bottom: 15px; text-align: center; outline: none;
        }
        .nickname-box input:focus { border-color: #f1c40f; }
        .nickname-box button {
            background: #2980b9; border: none; color: white; padding: 12px 30px;
            border-radius: 30px; font-size: 18px; cursor: pointer; margin: 5px; min-height: 48px;
        }
        .nickname-box .skip-btn { background: #555; }

        h1 { font-size: 20px; margin: 6px 0; }
        .top-bar {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 4px 8px; padding: 4px 10px; background: #222; border-bottom: 1px solid #333;
        }
        .top-bar .player-id { color: #f1c40f; font-size: 14px; font-weight: bold; }
        .top-bar .gm-indicator { color: #8e44ad; font-size: 13px; }
        .top-bar button {
            background: #2c3e50; border: 2px solid #444; color: white;
            padding: 4px 12px; border-radius: 16px; font-size: 13px;
            cursor: pointer; touch-action: manipulation; min-height: 32px; transition: 0.2s;
        }
        .top-bar button:hover { border-color: #f1c40f; }
        .top-bar button:active { transform: scale(0.95); }
        .top-bar button.active { border-color: #f1c40f; background: #34495e; }
        .top-bar button.gm-btn.active { background: #f1c40f; color: #1e1e1e; border-color: #f1c40f; }
        .top-bar button.danger { background: #c0392b; border-color: #c0392b; }
        .top-bar button[data-map] { font-size: 12px; padding: 2px 10px; min-height: 28px; }
        .top-bar button[data-map].active { border-color: #f1c40f; background: #34495e; }
        .top-bar button[data-map].disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

        .gm-only { display: none !important; }
        .gm-only.visible { display: inline-block !important; }
        .gm-only-flex { display: none !important; }
        .gm-only-flex.visible { display: flex !important; }

        .map-wrapper {
            position: relative; width: 100%; max-width: 800px; margin: 0 auto;
            aspect-ratio: 16 / 10; background: #1a1a1a; overflow: hidden;
            touch-action: none; cursor: grab; border: 2px solid #333; border-radius: 4px;
        }
        .map-wrapper:active { cursor: grabbing; }
        .map-viewport {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            transform-origin: center center;
            will-change: transform; touch-action: none;
        }
        .map-content {
            position: relative;
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }
        .map-image {
            width: 100%; height: 100%; object-fit: contain; display: block;
            background: #1a1a1a; pointer-events: none;
        }

        .grid-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .grid-overlay {
            width: 100%; height: 100%;
            display: grid;
            pointer-events: none;
        }
        .grid-overlay .cell {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.02);
            width: 100%; height: 100%;
        }
        .grid-overlay.hidden { display: none; }

        .tokens-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            touch-action: none;
            z-index: 10;
            pointer-events: none;
        }
        .token {
            position: absolute;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            border: 2px solid white;
            cursor: grab;
            touch-action: none;
            text-shadow: 0 0 5px black;
            transform: translate(-50%, -50%);
            pointer-events: all;
            will-change: transform, width, height, font-size;
        }
        .token:active { cursor: grabbing; filter: brightness(1.3); z-index: 20; }
        .token.snap { transition: left 0.1s ease, top 0.1s ease; }

        .zoom-controls {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 4px 8px; padding: 6px 10px; background: #222; border-bottom: 1px solid #333;
        }
        .zoom-controls button {
            background: #2c3e50; border: 2px solid #444; color: white;
            padding: 4px 12px; border-radius: 16px; font-size: 14px;
            cursor: pointer; touch-action: manipulation; min-height: 32px;
        }
        .zoom-controls .zoom-label { color: #aaa; font-size: 13px; min-width: 40px; }

        .gm-controls {
            display: none; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 4px 8px; padding: 6px 10px; background: #222; border-bottom: 1px solid #333;
        }
        .gm-controls.visible { display: flex; }
        .gm-controls button {
            background: #2c3e50; border: 2px solid #444; color: white;
            padding: 4px 12px; border-radius: 16px; font-size: 14px;
            cursor: pointer; touch-action: manipulation; min-height: 32px;
        }
        .gm-controls input[type="number"] {
            width: 50px; background: #1a1a1a; border: 2px solid #444; color: #fff;
            border-radius: 8px; padding: 4px 6px; text-align: center; font-size: 14px;
        }
        .gm-controls input[type="number"]:focus { border-color: #f1c40f; outline: none; }
        .gm-controls input[type="range"] {
            width: 70px; accent-color: #f1c40f; cursor: pointer; touch-action: manipulation;
        }
        .gm-controls .grid-label { color: #888; font-size: 12px; }
        .gm-controls .size-label { color: #aaa; font-size: 12px; min-width: 35px; }

        .dice-controls {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center;
            gap: 4px 8px; padding: 6px 10px; background: #222; border-bottom: 1px solid #333;
        }
        .dice-controls button {
            background: #34495e; border: none; color: white; padding: 6px 14px;
            border-radius: 20px; font-size: 16px; min-height: 38px; min-width: 38px;
            cursor: pointer; touch-action: manipulation; box-shadow: 0 2px 0 #1f2c38;
        }
        .dice-controls button:active { transform: translateY(2px); box-shadow: none; }
        .dice-controls button.d20 { background: #2980b9; box-shadow: 0 2px 0 #1a5276; }
        .dice-controls .dice-area {
            font-size: 32px; background: #2a2a2a; padding: 4px 16px;
            border-radius: 16px; min-width: 60px; display: inline-block;
        }
        .dice-controls .log { font-size: 14px; color: #aaa; min-height: 24px; }

        .icon-picker {
            display: none; background: #2a2a2a; padding: 8px; border-radius: 12px;
            margin: 4px auto; max-width: 350px; flex-wrap: wrap; justify-content: center;
            gap: 4px; border: 2px solid #555;
        }
        .icon-picker.active { display: flex; }
        .icon-picker button { font-size: 28px; background: #444; border: 2px solid transparent; border-radius: 8px; padding: 4px 10px; min-height: 44px; cursor: pointer; }

        .roll-log-container {
            max-width: 800px; margin: 10px auto; background: rgba(0,0,0,0.8);
            border-radius: 8px; padding: 6px 12px; border: 1px solid #333;
            max-height: 150px; overflow-y: auto; width: 98%;
        }
        .roll-log-container::-webkit-scrollbar { width: 4px; }
        .roll-log-container::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
        .roll-log-title { font-size: 10px; color: #666; text-transform: uppercase; margin-bottom: 2px; text-align: left; }
        .roll-log-entry { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); color: #ddd; text-align: left; }
        .roll-log-entry:last-child { border-bottom: none; }
        .roll-log-entry .roll-player { color: #f1c40f; font-weight: bold; font-size: 12px; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .roll-log-entry .roll-dice { color: #888; font-size: 11px; }
        .roll-log-entry .roll-value { color: #fff; font-weight: bold; background: #2a2a2a; padding: 0 8px; border-radius: 4px; min-width: 24px; text-align: center; font-size: 13px; }
        .roll-log-entry .roll-crit { color: #f1c40f; animation: pulseGold 0.5s ease; }
        .roll-log-entry .roll-fail { color: #e74c3c; animation: pulseRed 0.5s ease; }
        .roll-log-empty { color: #555; font-style: italic; font-size: 12px; padding: 4px 0; text-align: center; }

        @keyframes pulseGold { 0% { transform: scale(1); } 50% { transform: scale(1.3); color: #ffd700; } 100% { transform: scale(1); } }
        @keyframes pulseRed { 0% { transform: scale(1); } 50% { transform: scale(1.3); color: #ff0000; } 100% { transform: scale(1); } }

        .roll-toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 6px 16px;
            border-radius: 8px; font-size: 14px; border: 1px solid #f1c40f;
            z-index: 999; animation: slideUp 0.3s ease, fadeOut 3s ease 2.5s forwards;
            pointer-events: none; max-width: 90%; white-space: nowrap;
        }
        @keyframes slideUp { 0% { transform: translateX(-50%) translateY(20px); opacity: 0; } 100% { transform: translateX(-50%) translateY(0); opacity: 1; } }
        @keyframes fadeOut { 0% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-10px); } }

        @media (max-width: 600px) {
            h1 { font-size: 16px; }
            .top-bar button { font-size: 11px; padding: 2px 8px; min-height: 26px; }
            .top-bar button[data-map] { font-size: 10px; padding: 2px 6px; min-height: 24px; }
            .zoom-controls button { font-size: 12px; padding: 2px 8px; min-height: 28px; }
            .gm-controls button { font-size: 12px; padding: 2px 8px; min-height: 28px; }
            .gm-controls input[type="number"] { width: 40px; font-size: 12px; }
            .gm-controls input[type="range"] { width: 50px; }
            .dice-controls button { font-size: 14px; padding: 4px 10px; min-height: 32px; min-width: 32px; }
            .dice-controls .dice-area { font-size: 26px; padding: 2px 12px; min-width: 44px; }
            .roll-log-container { max-height: 100px; }
            .roll-log-entry { font-size: 11px; }
            .roll-log-entry .roll-player { max-width: 50px; font-size: 10px; }
        }
    </style>
</head>
<body>
    <h1>⚔️ Поле боя</h1>

    <div class="nickname-container" id="nicknameContainer">
        <div class="nickname-box">
            <label for="nicknameInput">👤 Введи свой ник:</label>
            <input type="text" id="nicknameInput" placeholder="Например: Гэндальф" maxlength="20">
            <button onclick="saveNickname()">✅ Сохранить</button>
            <button onclick="skipNickname()" class="skip-btn">Пропустить</button>
        </div>
    </div>

    <div class="top-bar">
        <span class="player-id" id="playerId">Загрузка...</span>
        <span class="gm-indicator" id="gmIndicator"></span>
        <button onclick="toggleGM()" class="gm-btn" id="gmToggleBtn">👑 GM</button>
        <button onclick="showChangeName()" class="gm-only">✏️ Сменить ник</button>
        <button onclick="showIconPicker()" class="gm-only">➕ Добавить</button>
        <button class="danger gm-only" onclick="clearTokens()">🗑️</button>
        <button onclick="toggleGrid()" class="active" id="gridToggleBtn">📐</button>
        <button onclick="toggleSnap()" class="gm-only active" id="snapToggleBtn">🎯</button>
    </div>

    <div class="top-bar gm-only-flex" id="mapSelector" style="border-bottom: none; background: #1a1a1a; gap: 4px; padding: 4px 10px;">
        <button onclick="changeMap('forest')" data-map="forest" class="active">🌲 Лес</button>
        <button onclick="changeMap('dungeon')" data-map="dungeon">🏚️ Подземелье</button>
        <button onclick="changeMap('castle')" data-map="castle">🏰 Замок</button>
        <button onclick="changeMap('tavern')" data-map="tavern">🍺 Таверна</button>
        <button onclick="changeMap('cave')" data-map="cave">🕳️ Пещера</button>
    </div>

    <div class="map-wrapper" id="mapWrapper">
        <div class="map-viewport" id="mapViewport">
            <div class="map-content">
                <img class="map-image" id="mapImage" src="images/forest.jpg" alt="Карта">
                <div class="grid-container" id="gridContainer">
                    <div class="grid-overlay" id="gridOverlay"></div>
                </div>
                <div class="tokens-layer" id="tokensLayer"></div>
            </div>
        </div>
    </div>

    <div class="zoom-controls">
        <button onclick="zoomOut()">➖</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button onclick="zoomIn()">➕</button>
        <button onclick="resetZoom()">⟲</button>
    </div>

    <div class="gm-controls" id="gmControls">
        <span style="color:#444;">|</span>
        <span class="grid-label">📐 Столбцов:</span>
        <input type="number" id="gridColsInput" min="2" max="100" value="10">
        <span class="grid-label">Строк:</span>
        <input type="number" id="gridRowsInput" min="2" max="60" value="6">
        <button onclick="applyGridSize()" style="font-size:12px; padding: 2px 10px; min-height: 28px;">Применить</button>
        <span style="color:#444;">|</span>
        <span class="grid-label">👤 Размер:</span>
        <input type="range" id="tokenSizeSlider" min="10" max="80" value="55">
        <span class="size-label" id="tokenSizeLabel">55%</span>
    </div>

    <div class="dice-controls">
        <div class="dice-area" id="diceDisplay">🎲</div>
        <button class="d20" onclick="rollDice(20)">d20</button>
        <button onclick="rollDice(4)">d4</button>
        <button onclick="rollDice(6)">d6</button>
        <button onclick="rollDice(8)">d8</button>
        <button onclick="rollDice(10)">d10</button>
        <button onclick="rollDice(12)">d12</button>
        <button onclick="rollDice(100)">d100</button>
        <span class="log" id="log">Привет!</span>
    </div>

    <div class="icon-picker gm-only" id="iconPicker">
        <button onclick="addToken('🧙‍♂️')">🧙‍♂️</button>
        <button onclick="addToken('🏹')">🏹</button>
        <button onclick="addToken('🗡️')">🗡️</button>
        <button onclick="addToken('🛡️')">🛡️</button>
        <button onclick="addToken('🐉')">🐉</button>
        <button onclick="addToken('👹')">👹</button>
        <button onclick="addToken('🧝')">🧝</button>
        <button onclick="addToken('💀')">💀</button>
        <button onclick="addToken('🐺')">🐺</button>
        <button onclick="addToken('🧌')">🧌</button>
        <button onclick="hideIconPicker()" style="background:#c0392b;">✖</button>
    </div>

    <div class="roll-log-container" id="rollLogContainer">
        <div class="roll-log-title">📜 История бросков</div>
        <div id="rollLogEntries"><div class="roll-log-empty">Броски будут здесь...</div></div>
    </div>

    <script>
        // ==================== FIREBASE ====================
        const firebaseConfig = {
            apiKey: "AIzaSyCfb0M7LS3nzPcabFuvekS815GvH1fUK_Q",
            authDomain: "dnd-rubezhata.firebaseapp.com",
            databaseURL: "https://dnd-rubezhata-default-rtdb.firebaseio.com",
            projectId: "dnd-rubezhata",
            storageBucket: "dnd-rubezhata.firebasestorage.app",
            messagingSenderId: "67134397384",
            appId: "1:67134397384:web:2d29685b1070abaaba3efd"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==================== НИК И GM ====================
        const GM_PASSWORD = '123';
        let isGM = false;
        let playerName = localStorage.getItem('dnd_player_name') || '';
        const randomId = 'Player_' + Math.random().toString(36).substring(2, 6);
        let displayName = playerName || randomId;

        if (!playerName) {
            document.getElementById('nicknameContainer').classList.remove('hidden');
            document.getElementById('log').textContent = '👋 Введи свой ник!';
        } else {
            document.getElementById('nicknameContainer').classList.add('hidden');
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Привет, ' + displayName + '!';
        }

        function saveNickname() {
            const input = document.getElementById('nicknameInput');
            const name = input.value.trim();
            if (name.length === 0) { alert('❌ Введи хоть что-то!'); return; }
            if (name.length > 20) { alert('❌ Слишком длинный ник!'); return; }
            playerName = name; displayName = name;
            localStorage.setItem('dnd_player_name', name);
            document.getElementById('nicknameContainer').classList.add('hidden');
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Привет, ' + displayName + '!';
        }
        function skipNickname() {
            displayName = randomId;
            document.getElementById('nicknameContainer').classList.add('hidden');
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Играем без ника';
        }
        function showChangeName() {
            if (!isGM) return;
            const newName = prompt('✏️ Введи новый ник:', displayName);
            if (!newName) return;
            const trimmed = newName.trim();
            if (trimmed.length === 0 || trimmed.length > 20) { alert('❌ От 1 до 20 символов!'); return; }
            playerName = trimmed; displayName = trimmed;
            localStorage.setItem('dnd_player_name', trimmed);
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Привет, ' + displayName + '!';
        }

        function toggleGM() {
            if (isGM) {
                isGM = false;
                document.getElementById('gmIndicator').textContent = '';
                document.getElementById('gmToggleBtn').classList.remove('active');
                document.getElementById('log').textContent = '👑 Режим GM выключен';
                updateGMMode();
                return;
            }
            const password = prompt('👑 Введите пароль GM:');
            if (password === GM_PASSWORD) {
                isGM = true;
                document.getElementById('gmIndicator').textContent = '👑 GM';
                document.getElementById('gmIndicator').style.color = '#f1c40f';
                document.getElementById('gmToggleBtn').classList.add('active');
                document.getElementById('log').textContent = '👑 Режим GM включен!';
                updateGMMode();
            } else if (password !== null) {
                alert('❌ Неверный пароль!');
            }
        }

        function updateGMMode() {
            const gmElements = document.querySelectorAll('.gm-only, .gm-only-flex');
            gmElements.forEach(el => {
                if (isGM) {
                    el.classList.add('visible');
                } else {
                    el.classList.remove('visible');
                }
            });
            const gmControls = document.getElementById('gmControls');
            if (isGM) {
                gmControls.classList.add('visible');
            } else {
                gmControls.classList.remove('visible');
            }
            updateMapButtons();
        }

        // ==================== КАРТА: ZOOM / PAN ====================
        let scale = 1, panX = 0, panY = 0;
        let isDraggingMap = false, startX, startY, startPanX, startPanY, lastTouchDist = 0;
        const wrapper = document.getElementById('mapWrapper');
        const viewport = document.getElementById('mapViewport');
        const mapImage = document.getElementById('mapImage');
        const zoomLabel = document.getElementById('zoomLabel');

        function updateTransform() {
            const w = wrapper.clientWidth;
            const h = wrapper.clientHeight;
            const tx = (w / 2) * (1 - scale) + panX;
            const ty = (h / 2) * (1 - scale) + panY;
            viewport.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
            zoomLabel.textContent = Math.round(scale * 100) + '%';
            updateTokenSizes();
        }

        function zoomIn() { scale = Math.min(5, scale + 0.15); updateTransform(); }
        function zoomOut() { scale = Math.max(0.2, scale - 0.15); updateTransform(); }
        function resetZoom() { scale = 1; panX = 0; panY = 0; updateTransform(); }

        wrapper.addEventListener('mousedown', (e) => {
            if (e.target.closest('.token')) return;
            isDraggingMap = true;
            startX = e.clientX; startY = e.clientY;
            startPanX = panX; startPanY = panY;
            wrapper.style.cursor = 'grabbing';
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDraggingMap) return;
            panX = startPanX + (e.clientX - startX);
            panY = startPanY + (e.clientY - startY);
            updateTransform();
        });
        window.addEventListener('mouseup', () => { isDraggingMap = false; wrapper.style.cursor = 'grab'; });

        wrapper.addEventListener('touchstart', (e) => {
            if (e.target.closest('.token')) return;
            if (e.touches.length === 1) {
                isDraggingMap = true;
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                startPanX = panX; startPanY = panY;
            }
        }, { passive: true });

        wrapper.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDraggingMap) {
                panX = startPanX + (e.touches[0].clientX - startX);
                panY = startPanY + (e.touches[0].clientY - startY);
                updateTransform();
            }
            if (e.touches.length === 2) {
                const t1 = e.touches[0], t2 = e.touches[1];
                const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
                if (lastTouchDist > 0) {
                    scale = Math.min(5, Math.max(0.2, scale + (dist - lastTouchDist) * 0.005));
                    updateTransform();
                }
                lastTouchDist = dist;
                e.preventDefault();
            }
        }, { passive: false });

        wrapper.addEventListener('touchend', () => { isDraggingMap = false; lastTouchDist = 0; }, { passive: true });
        window.addEventListener('resize', updateTransform);

        // ==================== СЕТКА ====================
        let snapEnabled = true;
        let gridVisible = true;
        let gridCols = 10, gridRows = 6;
        const gridOverlay = document.getElementById('gridOverlay');
        const gridContainer = document.getElementById('gridContainer');
        const gridColsInput = document.getElementById('gridColsInput');
        const gridRowsInput = document.getElementById('gridRowsInput');

        const snapRef = db.ref('snapEnabled');
        snapRef.on('value', (snap) => {
            const val = snap.val();
            if (val !== null && val !== undefined) {
                snapEnabled = val;
                document.getElementById('snapToggleBtn').classList.toggle('active', snapEnabled);
                document.querySelectorAll('.token').forEach(el => el.classList.toggle('snap', snapEnabled));
            }
        });

        function toggleSnap() {
            if (!isGM) return;
            snapEnabled = !snapEnabled;
            snapRef.set(snapEnabled);
            document.getElementById('log').textContent = '🎯 Прилипание: ' + (snapEnabled ? 'Вкл' : 'Выкл');
        }

        const gridSizeRef = db.ref('gridSize');
        gridSizeRef.on('value', (snap) => {
            const data = snap.val();
            if (data) {
                const nc = data.cols || 10;
                const nr = data.rows || 6;
                if (nc !== gridCols || nr !== gridRows) {
                    gridCols = nc; gridRows = nr;
                    gridColsInput.value = gridCols;
                    gridRowsInput.value = gridRows;
                    buildGrid();
                    recalcTokenPositions();
                }
            }
        });

        function saveGridSize() {
            gridSizeRef.set({ cols: gridCols, rows: gridRows });
        }

        function buildGrid() {
            gridOverlay.innerHTML = '';
            gridOverlay.style.gridTemplateColumns = 'repeat(' + gridCols + ', 1fr)';
            gridOverlay.style.gridTemplateRows = 'repeat(' + gridRows + ', 1fr)';
            for (let i = 0; i < gridCols * gridRows; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                gridOverlay.appendChild(cell);
            }
        }
        buildGrid();

        function applyGridSize() {
            if (!isGM) return;
            let nc = parseInt(gridColsInput.value);
            let nr = parseInt(gridRowsInput.value);
            if (isNaN(nc) || nc < 2) nc = 2;
            if (isNaN(nr) || nr < 2) nr = 2;
            if (nc > 100) nc = 100;
            if (nr > 60) nr = 60;
            gridCols = nc; gridRows = nr;
            gridColsInput.value = gridCols;
            gridRowsInput.value = gridRows;
            buildGrid();
            recalcTokenPositions();
            saveGridSize();
            document.getElementById('log').textContent = '📐 Сетка: ' + gridCols + 'x' + gridRows;
        }

        gridColsInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyGridSize(); });
        gridRowsInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyGridSize(); });

        let tokenSizePercent = 55;
        const tokenSizeSlider = document.getElementById('tokenSizeSlider');
        const tokenSizeLabel = document.getElementById('tokenSizeLabel');

        tokenSizeSlider.addEventListener('input', function() {
            if (!isGM) return;
            tokenSizePercent = parseInt(this.value);
            tokenSizeLabel.textContent = tokenSizePercent + '%';
            updateTokenSizes();
        });

        function updateTokenSizes() {
            const cellW = 100 / gridCols;
            const cellH = 100 / gridRows;
            const size = Math.min(cellW, cellH) * (tokenSizePercent / 100);
            document.querySelectorAll('.token').forEach(t => {
                t.style.width = size + '%';
                t.style.height = size + '%';
                t.style.fontSize = Math.max(6, Math.min(30, size * 0.9)) + 'px';
                t.style.minWidth = '10px';
                t.style.minHeight = '10px';
                t.style.maxWidth = '70px';
                t.style.maxHeight = '70px';
            });
        }

        function toggleGrid() {
            gridVisible = !gridVisible;
            gridOverlay.classList.toggle('hidden');
            document.getElementById('gridToggleBtn').classList.toggle('active');
        }

        // ==================== ФИГУРКИ ====================
        const tokensLayer = document.getElementById('tokensLayer');
        let tokens = {};
        let nextId = 1;
        let draggedToken = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let isLocalUpdate = false;
        let isFirstLoad = true;
        const tokensRef = db.ref('tokens');

        function getSnapped(x, y) {
            if (!snapEnabled) return { x, y };
            const cw = 100 / gridCols, ch = 100 / gridRows;
            const col = Math.round(x / cw), row = Math.round(y / ch);
            return {
                x: Math.max(0, Math.min(100, col * cw + cw / 2)),
                y: Math.max(0, Math.min(100, row * ch + ch / 2))
            };
        }

        function recalcTokenPositions() {
            if (Object.keys(tokens).length === 0) return;
            Object.values(tokens).forEach(t => {
                const pos = getSnapped(t.x, t.y);
                t.x = pos.x;
                t.y = pos.y;
            });
            saveTokens();
            renderTokens();
        }

        tokensRef.on('value', (snapshot) => {
            if (isLocalUpdate) return;
            const data = snapshot.val();
            if (data) {
                tokens = data;
                let maxId = 0;
                Object.keys(tokens).forEach(id => {
                    const num = parseInt(id);
                    if (num > maxId) maxId = num;
                });
                nextId = maxId + 1;
            } else {
                tokens = {};
                nextId = 1;
            }
            isFirstLoad = false;
            renderTokens();
            setTimeout(updateTokenSizes, 50);
        });

        function renderToken(id) {
            const token = tokens[id];
            if (!token) return;
            let el = tokensLayer.querySelector(`[data-id="${id}"]`);
            if (!el) {
                el = document.createElement('div');
                el.className = 'token';
                if (snapEnabled) el.classList.add('snap');
                el.dataset.id = id;
                el.addEventListener('dblclick', () => deleteToken(id));
                el.addEventListener('touchstart', (e) => {
                    const timer = setTimeout(() => {
                        if (navigator.vibrate) navigator.vibrate(50);
                        deleteToken(id);
                    }, 800);
                    el._timer = timer;
                });
                el.addEventListener('touchend', () => clearTimeout(el._timer));
                el.addEventListener('touchmove', () => clearTimeout(el._timer));
                el.addEventListener('mousedown', (e) => startDrag(e, id));
                el.addEventListener('touchstart', (e) => startDrag(e, id), { passive: false });
                tokensLayer.appendChild(el);
            }
            el.textContent = token.icon;
            el.style.left = token.x + '%';
            el.style.top = token.y + '%';
            const size = Math.min(100 / gridCols, 100 / gridRows) * (tokenSizePercent / 100);
            el.style.width = size + '%';
            el.style.height = size + '%';
            el.style.fontSize = Math.max(6, Math.min(30, size * 0.9)) + 'px';
        }

        function renderTokens() {
            tokensLayer.innerHTML = '';
            Object.keys(tokens).forEach(id => renderToken(parseInt(id)));
            setTimeout(updateTokenSizes, 50);
        }

        function saveTokens() {
            if (Object.keys(tokens).length === 0 && !isFirstLoad) return;
            isLocalUpdate = true;
            tokensRef.set(tokens).then(() => { isLocalUpdate = false; });
        }

        function deleteToken(id) {
            if (!isGM) return;
            isLocalUpdate = true;
            tokensRef.child(id).remove().then(() => { isLocalUpdate = false; });
            document.getElementById('log').textContent = '🗑️ Удалён персонаж';
        }

        function addToken(icon) {
            if (!isGM) return;
            const pos = getSnapped(50 + (Math.random() - 0.5) * 10, 50 + (Math.random() - 0.5) * 10);
            const id = nextId++;
            const data = { icon, x: pos.x, y: pos.y };
            isLocalUpdate = true;
            tokensRef.child(id).set(data).then(() => { isLocalUpdate = false; });
            tokens[id] = data;
            renderToken(id);
            hideIconPicker();
            if (navigator.vibrate) navigator.vibrate(20);
            document.getElementById('log').textContent = '➕ Добавлен ' + icon;
        }

        function clearTokens() {
            if (!isGM) return;
            if (Object.keys(tokens).length === 0) return;
            if (confirm('Удалить всех персонажей?')) {
                isLocalUpdate = true;
                tokensRef.set(null).then(() => { isLocalUpdate = false; });
                document.getElementById('log').textContent = '🗑️ Все удалены';
            }
        }

        function showIconPicker() {
            if (!isGM) return;
            document.getElementById('iconPicker').classList.toggle('active');
        }
        function hideIconPicker() {
            document.getElementById('iconPicker').classList.remove('active');
        }

        // ===== ПЕРЕТАСКИВАНИЕ С УЧЕТОМ МАСШТАБА (ФИНАЛЬНАЯ ВЕРСИЯ) =====
        function startDrag(e, id) {
            e.preventDefault();
            const token = tokens[id];
            if (!token) return;

            const rect = wrapper.getBoundingClientRect();
            let cx, cy;
            if (e.type === 'touchstart') {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }

            // Координаты пальца в процентах внутри wrapper
            const px = (cx - rect.left) / rect.width * 100;
            const py = (cy - rect.top) / rect.height * 100;

            // Применяем обратный масштаб, чтобы скомпенсировать зум
            const scaledPx = px / scale;
            const scaledPy = py / scale;

            dragOffsetX = scaledPx - token.x;
            dragOffsetY = scaledPy - token.y;

            draggedToken = id;
            window.addEventListener('mousemove', onDrag);
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchmove', onDrag, { passive: false });
            window.addEventListener('touchend', endDrag, { passive: false });
        }

        function onDrag(e) {
            if (draggedToken === null) return;
            e.preventDefault();
            const token = tokens[draggedToken];
            if (!token) return;

            const rect = wrapper.getBoundingClientRect();
            let cx, cy;
            if (e.type === 'touchmove') {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }

            // Текущая позиция пальца в процентах внутри wrapper
            let px = (cx - rect.left) / rect.width * 100;
            let py = (cy - rect.top) / rect.height * 100;

            // Применяем обратный масштаб
            px = px / scale;
            py = py / scale;

            let nx = px - dragOffsetX;
            let ny = py - dragOffsetY;

            nx = Math.max(0, Math.min(100, nx));
            ny = Math.max(0, Math.min(100, ny));

            if (snapEnabled) {
                const snapped = getSnapped(nx, ny);
                nx = snapped.x;
                ny = snapped.y;
            }

            token.x = nx;
            token.y = ny;

            const el = tokensLayer.querySelector(`[data-id="${draggedToken}"]`);
            if (el) {
                el.style.left = nx + '%';
                el.style.top = ny + '%';
            }
        }

        function endDrag(e) {
            if (draggedToken !== null && tokens[draggedToken]) {
                const token = tokens[draggedToken];
                isLocalUpdate = true;
                tokensRef.child(draggedToken).set(token).then(() => { isLocalUpdate = false; });
                draggedToken = null;
            }
            window.removeEventListener('mousemove', onDrag);
            window.removeEventListener('mouseup', endDrag);
            window.removeEventListener('touchmove', onDrag);
            window.removeEventListener('touchend', endDrag);
        }

        // ==================== КАРТЫ ====================
        let currentMap = 'forest', isLocalMapUpdate = false;
        const mapRef = db.ref('currentMap');
        mapRef.on('value', (snap) => {
            if (isLocalMapUpdate) return;
            const name = snap.val();
            if (name && name !== currentMap) { currentMap = name;
                updateMapUI(name); }
        });

        function changeMap(name) {
            if (!isGM) return;
            isLocalMapUpdate = true;
            currentMap = name;
            mapRef.set(name).then(() => { isLocalMapUpdate = false; });
            updateMapUI(name);
            document.getElementById('log').textContent = '🗺️ Карта: ' + name;
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function updateMapUI(name) {
            mapImage.src = 'images/' + name + '.jpg';
            document.querySelectorAll('.top-bar button[data-map]').forEach(b => {
                b.classList.toggle('active', b.dataset.map === name);
            });
            resetZoom();
        }

        function updateMapButtons() {
            document.querySelectorAll('.top-bar button[data-map]').forEach(b => {
                if (isGM) {
                    b.classList.remove('disabled');
                } else {
                    b.classList.add('disabled');
                }
            });
        }

        mapRef.once('value', (snap) => {
            const name = snap.val();
            if (name) { currentMap = name;
                updateMapUI(name); }
            updateMapButtons();
            updateGMMode();
        });

        // ==================== КУБИКИ ====================
        const MAX_LOG = 15;

        function addLogEntry(player, sides, result) {
            const container = document.getElementById('rollLogEntries');
            const empty = container.querySelector('.roll-log-empty');
            if (empty) empty.remove();
            const entry = document.createElement('div');
            entry.className = 'roll-log-entry';
            let valHtml = '<span class="roll-value">' + result + '</span>';
            if (sides === 20 && result === 20) valHtml = '<span class="roll-value roll-crit">' + result + ' 🔥</span>';
            else if (sides === 20 && result === 1) valHtml = '<span class="roll-value roll-fail">' + result + ' 💀</span>';
            entry.innerHTML = '<span class="roll-player">' + player + '</span><span class="roll-dice">d' + sides + '</span>' + valHtml;
            container.prepend(entry);
            while (container.children.length > MAX_LOG) container.removeChild(container.lastChild);
        }

        function showToast(msg) {
            document.querySelectorAll('.roll-toast').forEach(el => el.remove());
            const div = document.createElement('div');
            div.className = 'roll-toast';
            div.textContent = msg;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        function rollDice(sides) {
            const result = Math.floor(Math.random() * sides) + 1;
            let crit = sides === 20 && result === 20;
            let fail = sides === 20 && result === 1;
            let msg = displayName + ' кинул d' + sides + ': ' + result;
            if (crit) msg += ' 🔥 КРИТ!';
            if (fail) msg += ' 💀 ПРОВАЛ!';
            document.getElementById('diceDisplay').textContent = '⏳';
            addLogEntry(displayName, sides, result);
            db.ref('rolls').push({ player: displayName, sides, result, crit, fail, timestamp: Date.now() });
            setTimeout(() => {
                document.getElementById('diceDisplay').textContent = '🎲 ' + result;
                document.getElementById('log').textContent = 'Твой бросок: ' + result;
            }, 200);
        }

        db.ref('rolls').limitToLast(1).on('child_added', (snap) => {
            const data = snap.val();
            if (data.player === displayName) return;
            addLogEntry(data.player, data.sides, data.result);
            let msg = '🎲 ' + data.player + ' кинул d' + data.sides + ': ' + data.result;
            if (data.crit) msg += ' 🔥';
            if (data.fail) msg += ' 💀';
            showToast(msg);
            document.getElementById('diceDisplay').textContent = '⏳';
            setTimeout(() => { document.getElementById('diceDisplay').textContent = '🎲 ' + data.result; }, 200);
        });

        // ==================== СТАРТ ====================
        updateTransform();
        if (!playerName) document.getElementById('log').textContent = '👋 Введи свой ник!';
    </script>
</body>
</html>
