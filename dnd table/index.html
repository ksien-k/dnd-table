<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DND Синхронная карта</title>
    
    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #eee;
            text-align: center;
            margin: 0;
            padding: 10px;
            padding-bottom: 30px;
            touch-action: pan-y; /* разрешаем вертикальный скролл */
        }
        h1 {
            font-size: 22px;
            margin: 10px 0;
        }

        /* ===== ВВОД НИКА ===== */
        .nickname-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
        }
        .nickname-container.hidden {
            display: none;
        }
        .nickname-box {
            background: #2a2a2a;
            padding: 30px 40px;
            border-radius: 20px;
            border: 2px solid #f1c40f;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .nickname-box label {
            display: block;
            font-size: 22px;
            margin-bottom: 15px;
            color: #eee;
        }
        .nickname-box input {
            width: 100%;
            padding: 12px;
            font-size: 20px;
            border-radius: 10px;
            border: 2px solid #555;
            background: #1e1e1e;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        .nickname-box input:focus {
            border-color: #f1c40f;
        }
        .nickname-box button {
            background: #2980b9;
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px;
            min-height: 48px;
        }
        .nickname-box button:hover {
            background: #3498db;
        }
        .nickname-box button:active {
            transform: scale(0.95);
        }
        .nickname-box .skip-btn {
            background: #555;
        }
        .nickname-box .skip-btn:hover {
            background: #777;
        }

        /* ===== КАРТА ===== */
        .map-wrapper {
            position: relative;
            max-width: 600px;
            margin: 10px auto;
            aspect-ratio: 10 / 6;
            border: 3px solid #555;
            width: 95vw;
            max-height: 70vh;
            overflow: hidden;
            touch-action: none;
            background: #1a1a1a;
            cursor: grab;
        }
        .map-wrapper:active {
            cursor: grabbing;
        }

        .map-inner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
            touch-action: none;
            will-change: transform;
        }

        .map-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            pointer-events: none;
            background: #1a1a1a;
        }

        /* ===== СЕТКА (поверх картинки) ===== */
        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            pointer-events: none;
            z-index: 5;
        }
        .grid-overlay .cell {
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.03);
        }
        .grid-overlay.hidden {
            display: none;
        }

        /* ===== ФИГУРКИ ===== */
        .tokens-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            z-index: 10;
        }
        .token {
            position: absolute;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            border: 2px solid white;
            cursor: grab;
            touch-action: none;
            text-shadow: 0 0 5px black;
            transform: translate(-50%, -50%);
            left: 0;
            top: 0;
            z-index: 10;
            transition: filter 0.2s;
            width: 10%;
            height: 16.6%;
            min-width: 30px;
            min-height: 30px;
            max-width: 50px;
            max-height: 50px;
            font-size: 24px;
            will-change: transform, width, height, font-size;
        }
        .token:active {
            cursor: grabbing;
            filter: brightness(1.3);
            z-index: 20;
        }
        .token.snap {
            transition: left 0.1s ease, top 0.1s ease;
        }

        /* ===== КНОПКИ УПРАВЛЕНИЯ КАРТОЙ ===== */
        .map-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 8px 0;
        }
        .map-controls button {
            background: #2c3e50;
            border: 2px solid #555;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            touch-action: manipulation;
            min-height: 40px;
            min-width: 40px;
            transition: 0.2s;
        }
        .map-controls button:hover {
            background: #34495e;
            border-color: #f1c40f;
        }
        .map-controls button:active {
            transform: scale(0.95);
        }
        .map-controls button.active {
            border-color: #f1c40f;
            background: #34495e;
        }
        .map-controls .zoom-slider {
            width: 100px;
            accent-color: #f1c40f;
            cursor: pointer;
        }
        .map-controls .zoom-label {
            color: #aaa;
            font-size: 14px;
            min-width: 30px;
        }
        .map-controls .toggle-label {
            color: #aaa;
            font-size: 12px;
            margin: 0 4px;
        }

        /* ===== ОСТАЛЬНЫЕ КНОПКИ ===== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
        }
        .controls button {
            background: #34495e;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 30px;
            font-size: 20px;
            min-height: 50px;
            min-width: 50px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 3px 0 #1f2c38;
            transition: 0.1s;
        }
        .controls button:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        .controls button.danger {
            background: #c0392b;
            box-shadow: 0 3px 0 #78281f;
        }
        .controls button.d20 {
            background: #2980b9;
            box-shadow: 0 3px 0 #1a5276;
        }
        .controls button.gm-btn {
            background: #8e44ad;
            box-shadow: 0 3px 0 #6c3483;
        }
        .controls button.gm-btn.active {
            background: #f1c40f;
            color: #1e1e1e;
            box-shadow: 0 3px 0 #d4ac0d;
        }
        .controls button.change-name-btn {
            background: #27ae60;
            box-shadow: 0 3px 0 #1e8449;
        }

        /* ===== ВЫБОР КАРТЫ ===== */
        .map-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 10px 0;
        }
        .map-selector button {
            background: #2c3e50;
            border: 2px solid #555;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
            min-height: 44px;
        }
        .map-selector button:hover {
            background: #34495e;
            border-color: #f1c40f;
        }
        .map-selector button:active {
            transform: scale(0.95);
        }
        .map-selector button.active {
            border-color: #f1c40f;
            background: #34495e;
        }
        .map-selector button.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* ===== КУБИКИ ===== */
        .dice-area {
            font-size: 48px;
            background: #2a2a2a;
            padding: 10px 25px;
            display: inline-block;
            border-radius: 20px;
            margin: 5px 0;
            min-width: 100px;
        }
        .log {
            font-size: 18px;
            color: #aaa;
            min-height: 30px;
            padding: 10px;
        }

        .icon-picker {
            display: none;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 15px;
            margin: 5px auto;
            max-width: 350px;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            border: 2px solid #555;
        }
        .icon-picker.active {
            display: flex;
        }
        .icon-picker button {
            font-size: 30px;
            background: #444;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 5px 12px;
            min-height: 50px;
            cursor: pointer;
        }

        /* ===== ЛОГ БРОСКОВ ===== */
        .roll-log-container {
            max-width: 600px;
            margin: 15px auto 0 auto;
            background: rgba(20, 20, 20, 0.95);
            border-radius: 12px;
            padding: 10px 15px;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 95vw;
            max-height: 180px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .roll-log-container::-webkit-scrollbar {
            width: 4px;
        }
        .roll-log-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .roll-log-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }
        .roll-log-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 5px;
            text-align: left;
        }
        .roll-log-entry {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: #eee;
            text-align: left;
        }
        .roll-log-entry:last-child {
            border-bottom: none;
        }
        .roll-log-entry .roll-player {
            color: #f1c40f;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80px;
            font-size: 13px;
            flex-shrink: 0;
        }
        .roll-log-entry .roll-dice {
            color: #888;
            font-size: 12px;
            flex-shrink: 0;
        }
        .roll-log-entry .roll-value {
            color: #fff;
            font-weight: bold;
            background: #2a2a2a;
            padding: 0 10px;
            border-radius: 4px;
            min-width: 30px;
            text-align: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .roll-log-entry .roll-crit {
            color: #f1c40f;
            animation: pulseGold 0.5s ease;
        }
        .roll-log-entry .roll-fail {
            color: #e74c3c;
            animation: pulseRed 0.5s ease;
        }
        .roll-log-empty {
            color: #555;
            font-style: italic;
            font-size: 13px;
            padding: 5px 0;
            text-align: center;
        }

        @keyframes pulseGold {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ffd700; }
            100% { transform: scale(1); }
        }
        @keyframes pulseRed {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); color: #ff0000; }
            100% { transform: scale(1); }
        }

        /* ===== ТОСТ ===== */
        .roll-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 15px;
            border: 1px solid #f1c40f;
            z-index: 999;
            animation: slideUp 0.3s ease, fadeOut 3s ease 2.5s forwards;
            pointer-events: none;
            max-width: 90%;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        @keyframes slideUp {
            0% { transform: translateX(-50%) translateY(30px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
        }

        .hint {
            color: #666;
            font-size: 13px;
            margin: 10px;
        }
        .player-id {
            color: #f1c40f;
            font-size: 16px;
            margin: 5px;
            font-weight: bold;
        }
        .gm-indicator {
            color: #8e44ad;
            font-size: 14px;
            margin: 5px;
        }

        /* ===== АДАПТАЦИЯ ПОД ТЕЛЕФОН ===== */
        @media (max-width: 600px) {
            .map-wrapper {
                max-height: 60vh;
            }
            .map-controls .zoom-slider {
                width: 60px;
            }
            .map-controls button {
                font-size: 14px;
                padding: 4px 10px;
                min-height: 34px;
                min-width: 34px;
            }
        }
    </style>
</head>
<body>

    <h1>⚔️ Поле боя</h1>

    <!-- ===== ВВОД НИКА ===== -->
    <div class="nickname-container" id="nicknameContainer">
        <div class="nickname-box">
            <label for="nicknameInput">👤 Введи свой ник:</label>
            <input type="text" id="nicknameInput" placeholder="Например: Гэндальф" maxlength="20">
            <button onclick="saveNickname()">✅ Сохранить</button>
            <button onclick="skipNickname()" class="skip-btn">Пропустить</button>
        </div>
    </div>

    <div class="player-id" id="playerId">Загрузка...</div>
    <div class="gm-indicator" id="gmIndicator"></div>

    <!-- ===== КАРТА ===== -->
    <div class="map-wrapper" id="mapWrapper">
        <div class="map-inner" id="mapInner">
            <img class="map-image" id="mapImage" src="images/forest.jpg" alt="Карта">
            <div class="grid-overlay" id="gridOverlay">
                <!-- клетки генерируются JS -->
            </div>
            <div class="tokens-layer" id="tokensLayer"></div>
        </div>
    </div>

    <!-- ===== УПРАВЛЕНИЕ КАРТОЙ ===== -->
    <div class="map-controls">
        <button onclick="zoomOut()" title="Отдалить">➖</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button onclick="zoomIn()" title="Приблизить">➕</button>
        <button onclick="resetZoom()" title="Сбросить масштаб">⟲</button>
        <span class="toggle-label">|</span>
        <button id="snapToggleBtn" onclick="toggleSnap()" class="active">🎯 Прилипание</button>
        <button id="gridToggleBtn" onclick="toggleGrid()" class="active">📐 Сетка</button>
    </div>

    <!-- ===== ВЫБОР КАРТЫ ===== -->
    <div class="map-selector" id="mapSelector">
        <button onclick="changeMap('forest')" data-map="forest" class="active">🌲 Лес</button>
        <button onclick="changeMap('dungeon')" data-map="dungeon">🏚️ Подземелье</button>
        <button onclick="changeMap('castle')" data-map="castle">🏰 Замок</button>
        <button onclick="changeMap('tavern')" data-map="tavern">🍺 Таверна</button>
        <button onclick="changeMap('cave')" data-map="cave">🕳️ Пещера</button>
    </div>

    <!-- ===== КНОПКИ ===== -->
    <div class="controls">
        <button onclick="showIconPicker()">➕ Добавить</button>
        <button class="danger" onclick="clearTokens()">🗑️ Очистить</button>
        <button class="d20" onclick="rollDice(20)">🎲 d20</button>
        <button onclick="rollDice(6)">d6</button>
        <button onclick="rollDice(8)">d8</button>
        <button onclick="rollDice(10)">d10</button>
        <button onclick="rollDice(12)">d12</button>
        <button onclick="rollDice(100)">d100</button>
        <button class="gm-btn" id="gmToggleBtn" onclick="toggleGM()">👑 GM</button>
        <button class="change-name-btn" onclick="showChangeName()">✏️ Сменить ник</button>
    </div>

    <!-- ===== ВЫБОР ИКОНОК ===== -->
    <div class="icon-picker" id="iconPicker">
        <button onclick="addToken('🧙‍♂️')">🧙‍♂️</button>
        <button onclick="addToken('🏹')">🏹</button>
        <button onclick="addToken('🗡️')">🗡️</button>
        <button onclick="addToken('🛡️')">🛡️</button>
        <button onclick="addToken('🐉')">🐉</button>
        <button onclick="addToken('👹')">👹</button>
        <button onclick="addToken('🧝')">🧝</button>
        <button onclick="addToken('💀')">💀</button>
        <button onclick="addToken('🐺')">🐺</button>
        <button onclick="addToken('🧌')">🧌</button>
        <button onclick="hideIconPicker()" style="background:#c0392b;">✖</button>
    </div>

    <!-- ===== КУБИКИ ===== -->
    <div class="dice-area" id="diceDisplay">🎲</div>
    <div class="log" id="log">Добро пожаловать!</div>

    <!-- ===== ЛОГ БРОСКОВ ===== -->
    <div class="roll-log-container" id="rollLogContainer">
        <div class="roll-log-title">📜 История бросков</div>
        <div id="rollLogEntries">
            <div class="roll-log-empty">Броски будут здесь...</div>
        </div>
    </div>

    <div class="hint">👆 Двигай карту пальцами, приближай двумя пальцами. Перетаскивай фигурки.</div>

    <script>
        // ============================================
        // ТВОЙ КОНФИГ FIREBASE
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyCfb0M7LS3nzPcabFuvekS815GvH1fUK_Q",
            authDomain: "dnd-rubezhata.firebaseapp.com",
            databaseURL: "https://dnd-rubezhata-default-rtdb.firebaseio.com",
            projectId: "dnd-rubezhata",
            storageBucket: "dnd-rubezhata.firebasestorage.app",
            messagingSenderId: "67134397384",
            appId: "1:67134397384:web:2d29685b1070abaaba3efd"
        };
        // ============================================

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================
        // РАБОТА С НИКОМ И GM
        // ============================================
        const GM_PASSWORD = 'gm123';
        let isGM = false;
        let playerName = localStorage.getItem('dnd_player_name') || '';
        const randomId = 'Player_' + Math.random().toString(36).substring(2, 6);
        let displayName = playerName || randomId;

        if (!playerName) {
            document.getElementById('nicknameContainer').classList.remove('hidden');
            document.getElementById('log').textContent = '👋 Введи свой ник!';
        } else {
            document.getElementById('nicknameContainer').classList.add('hidden');
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Привет, ' + displayName + '!';
        }

        function saveNickname() {
            const input = document.getElementById('nicknameInput');
            const name = input.value.trim();
            if (name.length === 0) {
                alert('❌ Введи хотя бы один символ!');
                return;
            }
            if (name.length > 20) {
                alert('❌ Ник не может быть длиннее 20 символов!');
                return;
            }
            playerName = name;
            displayName = name;
            localStorage.setItem('dnd_player_name', name);
            document.getElementById('nicknameContainer').classList.add('hidden');
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Привет, ' + displayName + '!';
        }

        function skipNickname() {
            displayName = randomId;
            document.getElementById('nicknameContainer').classList.add('hidden');
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Играем без ника';
        }

        function showChangeName() {
            const newName = prompt('✏️ Введи новый ник:', displayName);
            if (newName === null) return;
            const trimmed = newName.trim();
            if (trimmed.length === 0) {
                alert('❌ Ник не может быть пустым!');
                return;
            }
            if (trimmed.length > 20) {
                alert('❌ Ник не может быть длиннее 20 символов!');
                return;
            }
            playerName = trimmed;
            displayName = trimmed;
            localStorage.setItem('dnd_player_name', trimmed);
            document.getElementById('playerId').textContent = '👤 ' + displayName;
            document.getElementById('log').textContent = '👋 Привет, ' + displayName + '!';
        }

        // ========== GM ==========
        function toggleGM() {
            if (isGM) {
                isGM = false;
                document.getElementById('gmIndicator').textContent = '';
                document.getElementById('gmToggleBtn').classList.remove('active');
                document.getElementById('log').textContent = '👑 Режим GM выключен';
                updateMapButtons();
                return;
            }

            const password = prompt('👑 Введите пароль GM:');
            if (password === null) return;
            if (password === GM_PASSWORD) {
                isGM = true;
                document.getElementById('gmIndicator').textContent = '👑 РЕЖИМ GM ВКЛЮЧЕН';
                document.getElementById('gmIndicator').style.color = '#f1c40f';
                document.getElementById('gmToggleBtn').classList.add('active');
                document.getElementById('log').textContent = '👑 Режим GM включен!';
                updateMapButtons();
            } else {
                alert('❌ Неверный пароль!');
            }
        }

        // ============================================
        // УПРАВЛЕНИЕ КАРТОЙ (Zoom + Pan)
        // ============================================
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY, startPanX, startPanY;
        let lastTouchDist = 0;

        const mapWrapper = document.getElementById('mapWrapper');
        const mapInner = document.getElementById('mapInner');
        const mapImage = document.getElementById('mapImage');
        const zoomLabel = document.getElementById('zoomLabel');

        function updateTransform() {
            mapInner.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
            zoomLabel.textContent = Math.round(scale * 100) + '%';
            
            // Масштабируем фигурки
            const tokens = document.querySelectorAll('.token');
            tokens.forEach(token => {
                const baseSize = 28;
                const newSize = Math.min(50, Math.max(22, baseSize * scale));
                token.style.fontSize = newSize + 'px';
                // Размер кружка тоже подгоняем
                const sizePercent = Math.min(14, Math.max(8, 10 * scale));
                token.style.width = sizePercent + '%';
                token.style.height = (sizePercent * 1.66) + '%';
            });
        }

        // ===== ЗУМ КНОПКАМИ =====
        function zoomIn() {
            scale = Math.min(3, scale + 0.15);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(0.3, scale - 0.15);
            updateTransform();
        }

        function resetZoom() {
            scale = 1;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        // ===== ПЕРЕТАСКИВАНИЕ КАРТЫ (мышь) =====
        mapWrapper.addEventListener('mousedown', function(e) {
            if (e.target.closest('.token')) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startPanX = panX;
            startPanY = panY;
            mapWrapper.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            panX = startPanX + dx;
            panY = startPanY + dy;
            updateTransform();
        });

        window.addEventListener('mouseup', function() {
            isDragging = false;
            mapWrapper.style.cursor = 'grab';
        });

        // ===== ПЕРЕТАСКИВАНИЕ КАРТЫ (touch) =====
        mapWrapper.addEventListener('touchstart', function(e) {
            if (e.target.closest('.token')) return;
            if (e.touches.length === 1) {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                startPanX = panX;
                startPanY = panY;
            }
        }, { passive: true });

        mapWrapper.addEventListener('touchmove', function(e) {
            if (e.touches.length === 1 && isDragging) {
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;
                panX = startPanX + dx;
                panY = startPanY + dy;
                updateTransform();
            }
            // ===== PINCH-TO-ZOOM =====
            if (e.touches.length === 2) {
                const touch1 = e.touches[0];
                const touch2 = e.touches[1];
                const dist = Math.hypot(touch1.clientX - touch2.clientX, touch1.clientY - touch2.clientY);
                if (lastTouchDist > 0) {
                    const delta = dist - lastTouchDist;
                    const newScale = Math.min(3, Math.max(0.3, scale + delta * 0.005));
                    scale = newScale;
                    updateTransform();
                }
                lastTouchDist = dist;
                e.preventDefault();
            }
        }, { passive: false });

        mapWrapper.addEventListener('touchend', function() {
            isDragging = false;
            lastTouchDist = 0;
        }, { passive: true });

        // ============================================
        // СЕТКА
        // ============================================
        let snapEnabled = true;
        let gridVisible = true;
        const GRID_COLS = 10;
        const GRID_ROWS = 6;

        function buildGrid() {
            const overlay = document.getElementById('gridOverlay');
            overlay.innerHTML = '';
            overlay.style.gridTemplateColumns = 'repeat(' + GRID_COLS + ', 1fr)';
            overlay.style.gridTemplateRows = 'repeat(' + GRID_ROWS + ', 1fr)';
            for (let i = 0; i < GRID_COLS * GRID_ROWS; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                overlay.appendChild(cell);
            }
        }
        buildGrid();

        function toggleGrid() {
            gridVisible = !gridVisible;
            document.getElementById('gridOverlay').classList.toggle('hidden');
            document.getElementById('gridToggleBtn').classList.toggle('active');
        }

        function toggleSnap() {
            snapEnabled = !snapEnabled;
            document.getElementById('snapToggleBtn').classList.toggle('active');
            document.querySelectorAll('.token').forEach(el => {
                el.classList.toggle('snap');
            });
            document.getElementById('log').textContent = '🎯 Прилипание: ' + (snapEnabled ? 'Вкл' : 'Выкл');
        }

        // ============================================
        // ФИГУРКИ
        // ============================================
        const tokensLayer = document.getElementById('tokensLayer');
        let tokens = [];
        let nextId = 1;
        let draggedToken = null;
        let dragOffsetX = 0, dragOffsetY = 0;
        let isLocalUpdate = false;

        function getSnappedPosition(x, y) {
            if (!snapEnabled) return { x, y };
            const cellW = 100 / GRID_COLS;
            const cellH = 100 / GRID_ROWS;
            const col = Math.round(x / cellW);
            const row = Math.round(y / cellH);
            return {
                x: Math.max(0, Math.min(100, col * cellW + cellW / 2)),
                y: Math.max(0, Math.min(100, row * cellH + cellH / 2))
            };
        }

        function loadTokens() {
            const tokensRef = db.ref('tokens');
            tokensRef.on('value', (snapshot) => {
                if (isLocalUpdate) return;
                const data = snapshot.val();
                if (data) {
                    tokens = Object.values(data);
                    nextId = tokens.reduce((max, t) => Math.max(max, t.id), 0) + 1;
                } else {
                    tokens = [];
                }
                renderTokens();
            });
        }

        function saveTokens() {
            isLocalUpdate = true;
            const tokensRef = db.ref('tokens');
            const data = {};
            tokens.forEach(t => { data[t.id] = t; });
            tokensRef.set(data).then(() => { isLocalUpdate = false; });
        }

        function renderTokens() {
            tokensLayer.innerHTML = '';
            tokens.forEach(token => {
                const el = document.createElement('div');
                el.className = 'token';
                if (snapEnabled) el.classList.add('snap');
                el.textContent = token.icon;
                el.dataset.id = token.id;
                el.style.left = token.x + '%';
                el.style.top = token.y + '%';

                // Масштабируем размер под текущий зум
                const baseSize = 28;
                const newSize = Math.min(50, Math.max(22, baseSize * scale));
                el.style.fontSize = newSize + 'px';
                const sizePercent = Math.min(14, Math.max(8, 10 * scale));
                el.style.width = sizePercent + '%';
                el.style.height = (sizePercent * 1.66) + '%';

                el.addEventListener('dblclick', () => deleteToken(token.id));
                el.addEventListener('touchstart', (e) => {
                    const timer = setTimeout(() => {
                        if (navigator.vibrate) navigator.vibrate(50);
                        deleteToken(token.id);
                    }, 800);
                    el._timer = timer;
                });
                el.addEventListener('touchend', () => clearTimeout(el._timer));
                el.addEventListener('touchmove', () => clearTimeout(el._timer));

                el.addEventListener('mousedown', (e) => startDrag(e, token.id));
                el.addEventListener('touchstart', (e) => startDrag(e, token.id), { passive: false });

                tokensLayer.appendChild(el);
            });
        }

        function deleteToken(id) {
            tokens = tokens.filter(t => t.id !== id);
            saveTokens();
            document.getElementById('log').textContent = '🗑️ Удалён персонаж';
        }

        function addToken(icon) {
            // Случайная позиция со смещением, чтобы не накладывались
            const offsetX = (Math.random() - 0.5) * 10;
            const offsetY = (Math.random() - 0.5) * 10;
            const pos = getSnappedPosition(50 + offsetX, 50 + offsetY);
            const token = { id: nextId++, icon: icon, x: pos.x, y: pos.y };
            tokens.push(token);
            saveTokens();
            hideIconPicker();
            if (navigator.vibrate) navigator.vibrate(20);
            document.getElementById('log').textContent = '➕ Добавлен ' + icon;
        }

        function clearTokens() {
            if (tokens.length === 0) return;
            if (confirm('Удалить всех персонажей?')) {
                tokens = [];
                saveTokens();
                document.getElementById('log').textContent = '🗑️ Все удалены';
            }
        }

        function showIconPicker() {
            document.getElementById('iconPicker').classList.add('active');
        }

        function hideIconPicker() {
            document.getElementById('iconPicker').classList.remove('active');
        }

        // ========== ПЕРЕТАСКИВАНИЕ ФИГУРОК ==========
        function startDrag(e, tokenId) {
            e.preventDefault();
            const token = tokens.find(t => t.id === tokenId);
            if (!token) return;

            const rect = mapWrapper.getBoundingClientRect();
            let clientX, clientY;
            if (e.type === 'touchstart') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const tokenX = (clientX - rect.left) / rect.width * 100;
            const tokenY = (clientY - rect.top) / rect.height * 100;
            dragOffsetX = tokenX - token.x;
            dragOffsetY = tokenY - token.y;
            draggedToken = token;

            window.addEventListener('mousemove', onDrag);
            window.addEventListener('mouseup', endDrag);
            window.addEventListener('touchmove', onDrag, { passive: false });
            window.addEventListener('touchend', endDrag, { passive: false });
        }

        function onDrag(e) {
            if (!draggedToken) return;
            e.preventDefault();
            const rect = mapWrapper.getBoundingClientRect();
            let clientX, clientY;
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            let newX = (clientX - rect.left) / rect.width * 100 - dragOffsetX;
            let newY = (clientY - rect.top) / rect.height * 100 - dragOffsetY;
            
            if (snapEnabled) {
                const snapped = getSnappedPosition(newX, newY);
                newX = snapped.x;
                newY = snapped.y;
            } else {
                newX = Math.max(0, Math.min(100, newX));
                newY = Math.max(0, Math.min(100, newY));
            }

            draggedToken.x = newX;
            draggedToken.y = newY;

            const el = tokensLayer.querySelector(`[data-id="${draggedToken.id}"]`);
            if (el) {
                el.style.left = newX + '%';
                el.style.top = newY + '%';
            }
        }

        function endDrag(e) {
            if (draggedToken) {
                saveTokens();
                draggedToken = null;
            }
            window.removeEventListener('mousemove', onDrag);
            window.removeEventListener('mouseup', endDrag);
            window.removeEventListener('touchmove', onDrag);
            window.removeEventListener('touchend', endDrag);
        }

        // ============================================
        // СИНХРОНИЗАЦИЯ КАРТЫ
        // ============================================
        let currentMap = 'forest';
        let isLocalMapUpdate = false;

        const mapRef = db.ref('currentMap');
        mapRef.on('value', function(snapshot) {
            if (isLocalMapUpdate) return;
            const mapName = snapshot.val();
            if (mapName && mapName !== currentMap) {
                currentMap = mapName;
                updateMapUI(mapName);
            }
        });

        function changeMap(mapName) {
            if (!isGM) {
                document.getElementById('log').textContent = '⛔ Только GM может менять карту!';
                return;
            }

            isLocalMapUpdate = true;
            currentMap = mapName;
            mapRef.set(mapName).then(() => {
                isLocalMapUpdate = false;
            });
            updateMapUI(mapName);
            document.getElementById('log').textContent = '🗺️ Карта: ' + mapName;
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function updateMapUI(mapName) {
            mapImage.src = 'images/' + mapName + '.jpg';
            document.querySelectorAll('.map-selector button').forEach(btn => {
                btn.classList.remove('active');
            });
            const buttons = document.querySelectorAll('.map-selector button');
            const mapNames = ['forest', 'dungeon', 'castle', 'tavern', 'cave'];
            const index = mapNames.indexOf(mapName);
            if (index !== -1 && buttons[index]) {
                buttons[index].classList.add('active');
            }
            // Сбрасываем зум при смене карты
            resetZoom();
        }

        function updateMapButtons() {
            document.querySelectorAll('.map-selector button').forEach(btn => {
                if (isGM) {
                    btn.classList.remove('disabled');
                } else {
                    btn.classList.add('disabled');
                }
            });
        }

        mapRef.once('value', function(snapshot) {
            const mapName = snapshot.val();
            if (mapName) {
                currentMap = mapName;
                updateMapUI(mapName);
            }
            updateMapButtons();
        });

        // ============================================
        // ЛОГ БРОСКОВ
        // ============================================
        const MAX_LOG_ENTRIES = 12;

        function addLogEntry(player, sides, result) {
            const container = document.getElementById('rollLogEntries');
            
            const empty = container.querySelector('.roll-log-empty');
            if (empty) empty.remove();
            
            const entry = document.createElement('div');
            entry.className = 'roll-log-entry';
            
            let valueHtml = '<span class="roll-value">' + result + '</span>';
            if (sides === 20 && result === 20) {
                valueHtml = '<span class="roll-value roll-crit">' + result + ' 🔥</span>';
            } else if (sides === 20 && result === 1) {
                valueHtml = '<span class="roll-value roll-fail">' + result + ' 💀</span>';
            }
            
            entry.innerHTML = 
                '<span class="roll-player">' + player + '</span>' +
                '<span class="roll-dice">d' + sides + '</span>' +
                valueHtml;
            
            container.prepend(entry);
            
            while (container.children.length > MAX_LOG_ENTRIES) {
                container.removeChild(container.lastChild);
            }
        }

        // ========== ПОКАЗ ТОСТА ==========
        function showRollToast(msg) {
            const oldToasts = document.querySelectorAll('.roll-toast');
            oldToasts.forEach(el => el.remove());

            const div = document.createElement('div');
            div.className = 'roll-toast';
            div.textContent = msg;
            document.body.appendChild(div);

            setTimeout(() => {
                div.remove();
            }, 3000);
        }

        // ============================================
        // КУБИКИ
        // ============================================
        function rollDice(sides) {
            let result = Math.floor(Math.random() * sides) + 1;

            let msg = displayName + ' кинул d' + sides + ': ' + result;
            let crit = false;
            let fail = false;
            if (sides === 20 && result === 20) { crit = true; msg += ' 🔥 КРИТ!'; }
            if (sides === 20 && result === 1) { fail = true; msg += ' 💀 ПРОВАЛ!'; }

            let display = document.getElementById('diceDisplay');
            display.textContent = '⏳';

            addLogEntry(displayName, sides, result);

            const rollRef = db.ref('rolls');
            rollRef.push({
                player: displayName,
                sides: sides,
                result: result,
                crit: crit,
                fail: fail,
                timestamp: Date.now()
            });

            setTimeout(() => {
                display.textContent = '🎲 ' + result;
                document.getElementById('log').textContent = 'Твой бросок: ' + result;
            }, 200);
        }

        // ============================================
        // СЛУШАЕМ БРОСКИ ДРУГИХ
        // ============================================
        const rollRef = db.ref('rolls');
        rollRef.limitToLast(1).on('child_added', function(snapshot) {
            const data = snapshot.val();
            if (data.player === displayName) return;

            addLogEntry(data.player, data.sides, data.result);

            let msg = '🎲 ' + data.player + ' кинул d' + data.sides + ': ' + data.result;
            if (data.crit) msg += ' 🔥';
            if (data.fail) msg += ' 💀';
            showRollToast(msg);

            const display = document.getElementById('diceDisplay');
            display.textContent = '⏳';
            setTimeout(() => {
                display.textContent = '🎲 ' + data.result;
            }, 200);
        });

        // ============================================
        // ЗАПУСК
        // ============================================
        loadTokens();

        // Инициализация состояния кнопок
        document.getElementById('snapToggleBtn').classList.add('active');
        document.getElementById('gridToggleBtn').classList.add('active');
        updateTransform();

        if (!playerName) {
            document.getElementById('log').textContent = '👋 Введи свой ник!';
        }
    </script>
</body>
</html>
